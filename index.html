<!-- ==================== LOADING SCREEN + ABOUT ME + CRYPTO POPUP ==================== -->
<script>
  window.addEventListener('load', function() {
    const loader = document.getElementById('gwas-loader');
    const progressBar = document.getElementById('progress-bar');
    const loadingText = document.getElementById('loading-text');

    let progress = 0;
    const messages = [
      "Booting gwasOS...",
      "Loading beat catalog...",
      "Connecting to the sauce...",
      "game was a success",
      "Launching desktop..."
    ];
    let msgIndex = 0;

    const interval = setInterval(() => {
      progress += Math.random() * 7 + 3;
      if (progress > 100) progress = 100;
      progressBar.style.width = progress + '%';

      if (progress > msgIndex * 25 && msgIndex < messages.length) {
        loadingText.textContent = messages[msgIndex];
        msgIndex++;
      }

      if (progress >= 100) {
        clearInterval(interval);
        loader.style.transition = 'opacity 1.2s ease-out';
        loader.style.opacity = '0';

        setTimeout(() => {
          loader.remove();
          openAboutMeWindow();

          // === DELAYED CRYPTO REPORT POPUP ===
          setTimeout(() => {
            if (typeof showGwasosPopup === 'function') {
              showGwasosPopup();
            }
          }, 15000); // 15 seconds after desktop is ready

        }, 1200);
      }
    }, 90);
  });

 function openAboutMeWindow() {
  const sound = new Audio('programs/about-me/grunt-bday-party.mp3');
  sound.volume = 0.7;
  sound.play().catch(() => {});

  const win = $Window({
    title: "README.txt - Notepad",
    icons: { 16: "programs/about-me/coinstack.png" },
    width: 740,
    height: 620,
    resizable: false,
    minimizable: true,
    maximizable: true
  });

  // Force very high z-index
  setTimeout(() => {
    if (win.$element) {
      win.$element.css('z-index', '999999');
    }
  }, 100);

  fetch("programs/about-me/index.html")
    .then(r => r.text())
    .then(html => {
      win.$content.html(html);
    })
    .catch(() => {
      win.$content.html("<p>Error loading About Me content.</p>");
    });
}

  window.openAboutMe = openAboutMeWindow;
</script>

<script>
// Toggle Crypto Popup (Open / Close)
function toggleCryptoPopup() {
  const popup = document.getElementById('gwasos-crypto-popup');
  if (!popup) return;

  if (popup.classList.contains('hidden')) {
    showGwasosPopup();
  } else {
    hideGwasosPopup();
  }
}
</script>
<script>
// Toggle About Me Window
let aboutMeWindow = null;

function toggleAboutMeWindow() {
  if (!aboutMeWindow || aboutMeWindow.closed) {
    openAboutMeWindow();
  } else {
    aboutMeWindow.close();
  }
}
