<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Free Crypto Report.exe</title>
  <style>
    body {
      font-family: 'MS Sans Serif', sans-serif;
      margin: 0;
      padding: 20px;
      background: #c0c0c0;
      color: black;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Download the Free Crypto Report</h2>
  <p>Anyone Protocol: Future-proofing Privacy</p>

  <div id="email-form" class="hidden" style="margin-top: 20px;">
    <form onsubmit="handleSubmit(event)">
      <input type="email" id="email" placeholder="your@email.com" required style="width: 280px; padding: 8px;">
      <button type="submit" style="padding: 10px 30px;">Get My Free Report →</button>
    </form>
  </div>

  <script>
    function showEmailForm() {
      document.getElementById('initial').classList.add('hidden');
      document.getElementById('email-form').classList.remove('hidden');
    }

    function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (email) {
        alert("✅ Report sent to: " + email);
        window.close(); // or parent window close if needed
      }
    }
  </script>
</body>
</html>
